<!DOCTYPE html>
<html lang="pt">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>datepicker-lib: exemplo</title>
		<style>
			body { font-family: system-ui, sans-serif; padding: 2rem; }
			label { display: block; margin-bottom: 1rem; }
		</style>
	</head>
	<body>
		<label>
			Data de nascimento
			<input type="text" data-type="datepicker" />
		</label>
		<label>
			Data com valor inicial
			<input type="text" data-type="datepicker" value="05/03/2023" />
		</label>
		<p>Última data confirmada: <output id="result">-</output></p>

		<script src="../build/datepicker.js"></script>
		<script>
			datepicker_init(function (date) {
				document.getElementById("result").textContent = date;
			});
		</script>
	</body>
</html>
