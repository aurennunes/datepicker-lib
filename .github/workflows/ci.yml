name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # typecheck, build e testes
      - run: npm test
      # O build/ vai no repositório: tem de bater com o que o src/ gera.
      - name: build/ atualizado
        run: git diff --exit-code -- build
